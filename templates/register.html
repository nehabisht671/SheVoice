<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SheVoice</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">
        <a href="{{ url_for('home') }}">
            <i class="fa-solid fa-leaf"></i> SheVoice
        </a>
    </div>

    <div class="auth-card register-card">

        <div class="auth-icon">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h2>Create Account</h2>

        <p class="auth-subtitle">
            Join SheVoice and make your voice heard.
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info auth-alert">
                    {% for msg in messages %}
                        <p class="mb-0">{{ msg }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Registration Form -->
        <form method="POST" action="{{ url_for('register') }}">

            <div class="auth-input-group">
                <label>Full Name</label>

                <div class="auth-input-wrapper">
                    <i class="fa-regular fa-user"></i>

                    <input type="text"
                           name="name"
                           placeholder="Enter your full name"
                           required>
                </div>
            </div>

            <div class="auth-input-group">
                <label>Student ID</label>

                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-id-card"></i>

                    <input type="text"
                           name="student_id"
                           placeholder="Enter your student ID"
                           required>
                </div>
            </div>

            <div class="auth-input-group">
                <label>College Email</label>

                <div class="auth-input-wrapper">
                    <i class="fa-regular fa-envelope"></i>

                    <input type="email"
                           name="email"
                           placeholder="Enter your college email"
                           required>
                </div>
            </div>

            <div class="auth-input-group">
                <label>Create Password</label>

                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           name="password"
                           id="registerPassword"
                           placeholder="Minimum 8 characters"
                           minlength="8"
                           required>

                    <button type="button"
                            class="password-toggle"
                            onclick="toggleRegisterPassword()">

                        <i class="fa-regular fa-eye"
                           id="registerEye"></i>

                    </button>
                </div>
            </div>

            <button type="submit" class="auth-submit-btn">
                Create Account
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?

            <a href="{{ url_for('login', role='student') }}">
                Login here
            </a>
        </p>

    </div>

    <div class="auth-footer">

        <a href="{{ url_for('home') }}">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>

        <p>© 2026 SheVoice. Your Voice Matters.</p>

    </div>

</div>

<script>
function toggleRegisterPassword() {

    const password = document.getElementById("registerPassword");
    const eye = document.getElementById("registerEye");

    if (password.type === "password") {
        password.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        password.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
    }
}
</script>

</body>
</html>
